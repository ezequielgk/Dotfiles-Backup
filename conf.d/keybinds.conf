# ~/.config/sway/conf.d/keybinds.conf

# ==================================================
# 1. APLICACIONES PRINCIPALES
# ==================================================

bindsym $mod+Return      exec foot

# Navegadores

bindsym Mod1+w exec helium
bindsym $mod+w exec librewolf

bindsym $mod+e           exec thunar
bindsym $mod+Shift+v     exec foot -e hx

# ==================================================
# 2. CONTROL DEL SISTEMA Y SWAY
# ==================================================
bindsym $mod+q           kill
bindsym $mod+Shift+r     reload
bindsym $mod+Shift+s     exec ~/.config/sway/scripts/screenshot-area.sh
bindsym $mod+p           exec ~/.config/sway/scripts/screenshot-full.sh

# ==================================================
# 3. INTERFAZ Y MENÚS 
# ==================================================

bindsym $mod+space      exec noctalia msg panel-toggle launcher
bindsym $mod+s          exec noctalia msg panel-toggle control-center
bindsym $mod+comma      exec noctalia msg settings-toggle
bindsym Mod4+Shift+t    exec noctalia msg panel-toggle wallpaper
bindsym Mod4+Shift+b    exec noctalia msg bar-toggle
bindsym Control+Mod1+Delete exec noctalia msg panel-toggle session

bindsym Ctrl+Mod4+r     exec noctalia msg config-reload 

# ==================================================
# 4. AUDIO Y MULTIMEDIA 
# ==================================================

# --- Volumen ---
bindsym --locked XF86AudioRaiseVolume exec noctalia msg volume-up
bindsym --locked XF86AudioLowerVolume exec noctalia msg volume-down
bindsym --locked XF86AudioMute        exec noctalia msg volume-mute

# --- Reproducción ---
bindsym --locked XF86AudioPlay        exec noctalia msg media toggle
bindsym --locked XF86AudioNext        exec noctalia msg media next
bindsym --locked XF86AudioPrev        exec noctalia msg media previous
bindsym --locked XF86AudioStop        exec noctalia msg media stop

# ==================================================
# 5. GESTIÓN DE VENTANAS Y LAYOUTS
# ==================================================
floating_modifier $mod normal

# --- Modos de Layout ---
bindsym $mod+v           layout toggle split         # Alterna la división entre horizontal y vertical
bindsym $mod+d           layout toggle tabbed split  # Alterna entre ver todo dividido o en pestañas

bindsym $mod+f           fullscreen toggle
bindsym $mod+mod1+space floating toggle

# --- Scratchpad (Ventanas Ocultas) ---
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus       scratchpad show

# ==================================================
# 6. NAVEGACIÓN Y FOCO
# ==================================================
# --- Alternar Foco ---
bindsym $mod+Tab         focus mode_toggle
bindsym $mod+a           focus parent
bindsym Mod1+Tab         focus next
bindsym Mod1+Shift+Tab   focus prev

# --- Mover Foco (Vim y Flechas) ---
bindsym $mod+$left       focus left
bindsym $mod+$down       focus down
bindsym $mod+$up         focus up
bindsym $mod+$right      focus right

bindsym $mod+Left        focus left
bindsym $mod+Down        focus down
bindsym $mod+Up          focus up
bindsym $mod+Right       focus right

# --- Mover Ventanas (Vim y Flechas) ---
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up   move up
bindsym $mod+Shift+$right move right

bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

# --- Workspaces ---
bindsym $mod+Control+Left  workspace prev
bindsym $mod+Control+Right workspace next

# ==================================================
# 7. MODO REDIMENSIONAR (RESIZE)
# ==================================================
bindsym $mod+r mode "resize"

mode "resize" {
    # --- Estilo Vim ---
    bindsym $left  resize shrink width 10px
    bindsym $down  resize grow height 10px
    bindsym $up    resize shrink height 10px
    bindsym $right resize grow width 10px

    # --- Flechas ---
    bindsym Left   resize shrink width 10px
    bindsym Down   resize grow height 10px
    bindsym Up     resize shrink height 10px
    bindsym Right  resize grow width 10px

    # --- Salir ---
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
