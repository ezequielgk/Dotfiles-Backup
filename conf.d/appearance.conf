# ==========================================
# 1. VARIABLES (Temas, Fuentes y Cursores)
# ==========================================
set $font_main "Maple Mono"
set $font_fallback pango:monospace 0.001
set $cursor_theme Adwaita
set $cursor_size 20
set $gtk_theme adw-gtk3-dark
set $icon_theme Noctalia-Colloid-Dark

# ==========================================
# 2. CONFIGURACIÓN BASE
# ==========================================
# font pango:$font_main 10
font $font_fallback
seat seat0 xcursor_theme $cursor_theme $cursor_size

# ==========================================
# 3. APARIENCIA GENERAL (Bordes y Gaps)
# ==========================================
#default_border none | activar sin bordes
#default_floating_border none | activar sin bordes

default_border pixel 1
default_floating_border pixel 1

hide_edge_borders smart

titlebar_padding 1
#titlebar_border_thickness 0 activar sin bordes

gaps inner 8
gaps outer 10
smart_gaps off

# ==========================================
# 4. REGLAS DE VENTANAS (Window Rules)
# ==========================================
for_window [class=".*"] titlebar_none
#for_window [class=".*"] border pixel 0
for_window [class=".*"] opacity 0.96

# ==========================================
# 5. SWAYFX: EFECTOS VISUALES
# ==========================================
# --- Esquinas redondeadas ---
# corner_radius 20

# --- Desenfoque (Blur) ---
blur enable
blur_xray disable
blur_passes 3
blur_radius 6
blur_noise 0.00
blur_brightness 1
blur_contrast 1
blur_saturation 1

# --- Sombras ---
shadows enable
shadow_blur_radius 20
# shadow_color #00000022
# shadow_offset 0 0

# ==========================================
# 6. INTEGRACIÓN GTK (Autostart)
# ==========================================
set $gnome-schema org.gnome.desktop.interface

exec_always {
    gsettings set $gnome-schema gtk-theme $gtk_theme
    gsettings set $gnome-schema cursor-theme $cursor_theme
    gsettings set $gnome-schema font-name $font_main
    # gsettings set $gnome-schema color-scheme 'prefer-dark'
    gsettings set $gnome-schema icon-theme $icon_theme
}
